<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 536 180" width="536" height="180" role="img" aria-label="MX2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MX2 (dark background variant)</title>
  <defs>
    <!-- Inverted luminance direction: brightest at top (catches light on a dark panel),
         darkest stop kept well above black so it never merges into the header. -->
        <linearGradient id="mx2FillDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A0810"/>
      <stop offset="35%" stop-color="#C8102E"/>
      <stop offset="65%" stop-color="#F0B8C4"/>
      <stop offset="100%" stop-color="#FCF1E4"/>
    </linearGradient>
    <!-- Sheen kept as-is: a white highlight still reads correctly on black. -->
        <linearGradient id="mx2SheenDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Bounce light dropped: the warm under-glow simulated light reflecting off a pale
         surface that isn't there on a black panel. A faint dark warm edge replaces it,
         just enough to keep the bottom stroke from looking flat. -->
        <linearGradient id="mx2BounceDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFDFA6" stop-opacity="0.55"/>
      <stop offset="25%" stop-color="#FFDFA6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFDFA6" stop-opacity="0"/>
    </linearGradient>
    <g id="mx2Glyphs">
      <!-- M: upright, square terminals, machine stem -->
      <path d="M12 24h28L100 108l60-84h28v132h-28V60L100 140 40 60v96H12V24z"/>
      <!-- X: equal bars, no italic -->
      <path d="M204 24h28L340 156h-28L204 24z"/>
      <path d="M312 24h28L232 156h-28L312 24z"/>
      <!-- 2: 7-segment / drum-machine index, even counters -->
      <path d="M360 24h160v28H360zM492 24h28v80h-28zM360 76h160v28H360zM360 76h28v80H360zM360 128h160v28H360z"/>
    </g>
  </defs>
  <use href="#mx2Glyphs" fill="url(#mx2FillDark)"/>
  <use href="#mx2Glyphs" fill="url(#mx2BounceDark)" opacity="0.45"/>
  <use href="#mx2Glyphs" fill="url(#mx2SheenDark)"/>
</svg>
